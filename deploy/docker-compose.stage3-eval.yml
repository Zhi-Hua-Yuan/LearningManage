services:
  mysql:
    image: ${CI_MYSQL_IMAGE:?CI_MYSQL_IMAGE is required}
    environment:
      MYSQL_ROOT_PASSWORD: ${CI_MYSQL_ADMIN_PASSWORD:?CI_MYSQL_ADMIN_PASSWORD is required}
    ports:
      - "127.0.0.1:13316:3306"
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_0900_ai_ci
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$${MYSQL_ROOT_PASSWORD} --silent"]
      interval: 3s
      timeout: 3s
      retries: 30
      start_period: 10s
    networks: [stage3-internal, stage3-host]

  ai-stub:
    image: ${CI_AI_STUB_IMAGE:?CI_AI_STUB_IMAGE is required}
    command: ["python", "/opt/ai-stub/ai-chat-completions-stub.py"]
    volumes:
      - ../scripts/ci/stubs/ai-chat-completions-stub.py:/opt/ai-stub/ai-chat-completions-stub.py:ro
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/health', timeout=2)"]
      interval: 3s
      timeout: 3s
      retries: 20
      start_period: 2s
    networks: [stage3-internal]

  backend:
    image: ${CI_BACKEND_IMAGE:?CI_BACKEND_IMAGE is required}
    depends_on:
      mysql:
        condition: service_healthy
      ai-stub:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: prod
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/${CI_EMPTY_DB_NAME:?CI_EMPTY_DB_NAME is required}?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Shanghai&characterEncoding=utf8
      DB_HOST: mysql
      DB_PORT: "3306"
      DB_NAME: ${CI_EMPTY_DB_NAME:?CI_EMPTY_DB_NAME is required}
      DB_USERNAME: ${TEST_DB_USERNAME:?TEST_DB_USERNAME is required}
      DB_PASSWORD: ${TEST_DB_PASSWORD:?TEST_DB_PASSWORD is required}
      FLYWAY_ENABLED: "false"
      FLYWAY_DB_USERNAME: __flyway_migrator_not_configured__
      FLYWAY_DB_PASSWORD: __flyway_migrator_not_configured__
      REDIS_HOST: 127.0.0.1
      REDIS_PORT: "6379"
      AI_BASE_URL: http://ai-stub:8080/compatible-mode/v1
      AI_MODEL: ci-ai-stub
      AI_BREAKDOWN_MODEL: ci-ai-stub
      AI_POLISH_MODEL: ci-ai-stub
      AI_FALLBACK_MODEL: ci-ai-stub
      AI_CONNECT_TIMEOUT_MS: "2000"
      AI_READ_TIMEOUT_MS: "5000"
      AI_TOTAL_TIMEOUT_MS: "15000"
      # Fault cases intentionally generate consecutive upstream failures. Keep
      # their process state isolated so a prior case cannot open the shared
      # model circuit and change the contract exercised by a later case.
      AI_CB_SLIDING_WINDOW_SIZE: "1000"
      AI_CB_MINIMUM_CALLS: "1000"
      AI_RATE_LIMIT_ENABLED: "false"
      ALIYUN_API_KEY: ci-only-not-a-real-key
      JWT_SECRET: ci-only-stage3-jwt-secret-with-at-least-32-bytes
    ports:
      - "127.0.0.1:18133:8123"
    networks: [stage3-internal, stage3-edge]

networks:
  stage3-internal:
    internal: true
  stage3-host:
    driver: bridge
  stage3-edge:
    driver: bridge
