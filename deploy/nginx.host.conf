limit_req_zone $binary_remote_addr zone=lm_login:10m rate=10r/m;
limit_req_zone $binary_remote_addr zone=lm_register:10m rate=5r/m;
limit_req_zone $binary_remote_addr zone=lm_ai:10m rate=30r/m;

server {
    listen 80;
    listen [::]:80;
    server_name __DOMAIN__;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name __DOMAIN__;
    server_tokens off;

    ssl_certificate /etc/letsencrypt/live/__DOMAIN__/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/__DOMAIN__/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    client_max_body_size 2m;
    limit_req_status 429;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Strict-Transport-Security "max-age=31536000" always;

    location ~ ^/api/(doc\.html|swagger-ui(?:/|\.html)|v3/api-docs(?:/|$)|swagger-resources(?:/|$)|webjars(?:/|$)) {
        return 404;
    }

    location = /api/user/login {
        limit_req zone=lm_login burst=5 nodelay;
        proxy_pass http://127.0.0.1:18080;
        include proxy_params;
        proxy_set_header X-Forwarded-Proto https;
    }

    location = /api/user/register {
        limit_req zone=lm_register burst=3 nodelay;
        proxy_pass http://127.0.0.1:18080;
        include proxy_params;
        proxy_set_header X-Forwarded-Proto https;
    }

    location ^~ /api/ai/ {
        limit_req zone=lm_ai burst=10 nodelay;
        proxy_pass http://127.0.0.1:18080;
        proxy_connect_timeout 5s;
        proxy_send_timeout 150s;
        proxy_read_timeout 150s;
        include proxy_params;
        proxy_set_header X-Forwarded-Proto https;
    }

    location = /api/ai/rag/ask/stream {
        proxy_pass http://127.0.0.1:18080;
        proxy_http_version 1.1;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 150s;
        add_header X-Accel-Buffering no always;
        include proxy_params;
        proxy_set_header X-Forwarded-Proto https;
    }

    location / {
        proxy_pass http://127.0.0.1:18080;
        include proxy_params;
        proxy_set_header X-Forwarded-Proto https;
    }
}
