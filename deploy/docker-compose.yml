version: '3.8'

services:
  # ---------------- 1. 数据库集装箱 ----------------
  mysql:
    # 【修复1：加上国内镜像代理前缀，防止下载超时】
    image: ${MYSQL_IMAGE:-dockerpull.com/library/mysql:8.0}
    container_name: learning_mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?MYSQL_ROOT_PASSWORD is required}
      MYSQL_DATABASE: ${DB_NAME:-learning_manage}
      MYSQL_USER: ${DB_USERNAME:?DB_USERNAME is required}
      MYSQL_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is required}
    ports:
      - "${MYSQL_PORT:-3307}:3306"
    volumes:
      - ./mysql-data:/var/lib/mysql
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci

  qdrant:
    image: ${QDRANT_IMAGE:-qdrant/qdrant:v1.18.2}
    container_name: learning_qdrant
    restart: always
    ports:
      - "127.0.0.1:${QDRANT_PORT:-6333}:6333"
    volumes:
      - qdrant-data:/qdrant/storage
    healthcheck:
      test: ["CMD-SHELL", "bash -c ':> /dev/tcp/127.0.0.1/6333' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12

  # ---------------- 2. 后端集装箱 ----------------
  backend:
    build:
      context: ../
    container_name: learning_backend
    restart: always
    ports:
      - "${BACKEND_PORT:-8124}:8123"
    depends_on:
      - mysql
      - qdrant
    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-prod}
      DB_HOST: mysql
      DB_PORT: 3306
      DB_NAME: ${DB_NAME:-learning_manage}
      DB_USERNAME: ${DB_USERNAME:?DB_USERNAME is required}
      DB_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is required}
      FLYWAY_ENABLED: ${FLYWAY_ENABLED:-false}
      FLYWAY_DB_USERNAME: ${FLYWAY_DB_USERNAME:-__flyway_migrator_not_configured__}
      FLYWAY_DB_PASSWORD: ${FLYWAY_DB_PASSWORD:-__flyway_migrator_not_configured__}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required}
      ALIYUN_API_KEY: ${ALIYUN_API_KEY:?ALIYUN_API_KEY is required}
      AI_KNOWLEDGE_WORKER_ENABLED: ${AI_KNOWLEDGE_WORKER_ENABLED:-false}
      AI_EMBEDDING_BASE_URL: ${AI_EMBEDDING_BASE_URL:-https://dashscope.aliyuncs.com/compatible-mode/v1}
      AI_EMBEDDING_API_KEY: ${AI_EMBEDDING_API_KEY:-${ALIYUN_API_KEY}}
      AI_EMBEDDING_MODEL: ${AI_EMBEDDING_MODEL:-text-embedding-v4}
      AI_EMBEDDING_DIMENSION: ${AI_EMBEDDING_DIMENSION:-1024}
      QDRANT_BASE_URL: http://qdrant:6333
      QDRANT_API_KEY: ${QDRANT_API_KEY:-}
      QDRANT_COLLECTION: ${QDRANT_COLLECTION:-learning_knowledge_v1_1024}
      QDRANT_ALIAS: ${QDRANT_ALIAS:-learning_knowledge_current}

  # ---------------- 3. 前端集装箱 ----------------
  frontend:
    image: ${NGINX_IMAGE:-dockerpull.com/library/nginx:alpine}
    container_name: learning_frontend
    restart: always
    ports:
      - "${FRONTEND_PORT:-8080}:80"
    depends_on:
      - backend
    volumes:
      - ./dist:/usr/share/nginx/html
      - ./nginx.conf:/etc/nginx/conf.d/default.conf

volumes:
  qdrant-data:
