services:
  # ---------------- 1. 数据库集装箱 ----------------
  mysql:
    # 【修复1：加上国内镜像代理前缀，防止下载超时】
    image: ${MYSQL_IMAGE:-dockerpull.com/library/mysql:8.0}
    container_name: learning_mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?MYSQL_ROOT_PASSWORD is required}
      MYSQL_DATABASE: ${DB_NAME:-learning_manage}
      MYSQL_USER: ${DB_USERNAME:?DB_USERNAME is required}
      MYSQL_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is required}
    ports:
      - "${MYSQL_PORT:-3307}:3306"
    volumes:
      - ./mysql-data:/var/lib/mysql
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$${MYSQL_ROOT_PASSWORD} --silent"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s

  redis:
    image: ${REDIS_IMAGE:-redis:7.4-alpine}
    container_name: learning_redis
    restart: always
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?REDIS_PASSWORD is required}
    command: ["sh", "/opt/learning/redis-entrypoint-stage7.sh"]
    volumes:
      - redis-data:/data
      - ./redis/redis-entrypoint-stage7.sh:/opt/learning/redis-entrypoint-stage7.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "redis-cli --user learning_app --pass \"$${REDIS_PASSWORD}\" --no-auth-warning ping | grep PONG"]
      interval: 5s
      timeout: 5s
      retries: 20

  qdrant:
    image: ${QDRANT_IMAGE:-qdrant/qdrant:v1.18.2}
    container_name: learning_qdrant
    restart: always
    ports:
      - "127.0.0.1:${QDRANT_PORT:-6333}:6333"
    volumes:
      - qdrant-data:/qdrant/storage
    healthcheck:
      test: ["CMD-SHELL", "bash -c ':> /dev/tcp/127.0.0.1/6333' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12

  # ---------------- 2. 后端集装箱 ----------------
  backend:
    build:
      context: ../
    container_name: learning_backend
    restart: always
    ports:
      - "${BACKEND_PORT:-8124}:8123"
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      qdrant:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-prod}
      DB_HOST: mysql
      DB_PORT: 3306
      DB_NAME: ${DB_NAME:-learning_manage}
      DB_USERNAME: ${DB_USERNAME:?DB_USERNAME is required}
      DB_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is required}
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/${DB_NAME:-learning_manage}?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Shanghai&characterEncoding=utf8
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PORT: 6379
      SPRING_DATA_REDIS_USERNAME: learning_app
      SPRING_DATA_REDIS_PASSWORD: ${REDIS_PASSWORD:?REDIS_PASSWORD is required}
      FLYWAY_ENABLED: ${FLYWAY_ENABLED:-false}
      FLYWAY_DB_USERNAME: ${FLYWAY_DB_USERNAME:-__flyway_migrator_not_configured__}
      FLYWAY_DB_PASSWORD: ${FLYWAY_DB_PASSWORD:-__flyway_migrator_not_configured__}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required}
      ALIYUN_API_KEY: ${ALIYUN_API_KEY:?ALIYUN_API_KEY is required}
      AI_KNOWLEDGE_WORKER_ENABLED: ${AI_KNOWLEDGE_WORKER_ENABLED:-false}
      AI_EMBEDDING_BASE_URL: ${AI_EMBEDDING_BASE_URL:-https://dashscope.aliyuncs.com/compatible-mode/v1}
      AI_EMBEDDING_QUERY_BASE_URL: ${AI_EMBEDDING_QUERY_BASE_URL:-https://dashscope.aliyuncs.com/api/v1}
      AI_EMBEDDING_API_KEY: ${AI_EMBEDDING_API_KEY:-${ALIYUN_API_KEY}}
      AI_EMBEDDING_MODEL: ${AI_EMBEDDING_MODEL:-text-embedding-v4}
      AI_EMBEDDING_DIMENSION: ${AI_EMBEDDING_DIMENSION:-1024}
      QDRANT_BASE_URL: http://qdrant:6333
      QDRANT_API_KEY: ${QDRANT_API_KEY:-}
      QDRANT_COLLECTION: ${QDRANT_COLLECTION:-learning_knowledge_v1_1024}
      QDRANT_ALIAS: ${QDRANT_ALIAS:-learning_knowledge_current}
      QDRANT_REQUIRE_SECURE_TRANSPORT: 'false'
      AI_RAG_ENABLED: ${AI_RAG_ENABLED:-false}
      AI_RAG_REQUIRE_BACKFILL: ${AI_RAG_REQUIRE_BACKFILL:-true}
      AI_RAG_QUESTION_HMAC_SECRET: ${AI_RAG_QUESTION_HMAC_SECRET:-}
      AI_RERANK_BASE_URL: ${AI_RERANK_BASE_URL:-https://dashscope.aliyuncs.com/compatible-api/v1}
      AI_RERANK_API_KEY: ${AI_RERANK_API_KEY:-${ALIYUN_API_KEY}}
      AI_RERANK_MODEL: ${AI_RERANK_MODEL:-qwen3-rerank}
      AI_AGENT_ENABLED: ${AI_AGENT_ENABLED:-false}
      AI_AGENT_WORKER_ENABLED: ${AI_AGENT_WORKER_ENABLED:-false}
      AI_AGENT_TOOL_CALLING_ENABLED: ${AI_AGENT_TOOL_CALLING_ENABLED:-false}
      AI_AGENT_MAX_CONCURRENT_RUNS: ${AI_AGENT_MAX_CONCURRENT_RUNS:-4}
      AI_AGENT_MAX_CONCURRENT_RUNS_PER_USER: ${AI_AGENT_MAX_CONCURRENT_RUNS_PER_USER:-2}
      AI_AGENT_LEASE_SECONDS: ${AI_AGENT_LEASE_SECONDS:-90}
      AI_AGENT_OVERALL_TIMEOUT_SECONDS: ${AI_AGENT_OVERALL_TIMEOUT_SECONDS:-60}
      AI_AGENT_TOOL_TIMEOUT_SECONDS: ${AI_AGENT_TOOL_TIMEOUT_SECONDS:-10}
      MANAGEMENT_PORT: 9123
      MANAGEMENT_ADDRESS: 0.0.0.0
      MANAGEMENT_TRACING_ENABLED: ${MANAGEMENT_TRACING_ENABLED:-true}
      MANAGEMENT_TRACING_SAMPLING: ${MANAGEMENT_TRACING_SAMPLING:-1.0}
      OTEL_EXPORTER_OTLP_ENDPOINT: http://tempo:4318/v1/traces
      AI_CLEANUP_ENABLED: ${AI_CLEANUP_ENABLED:-false}
      AI_CLEANUP_SCHEDULE_ENABLED: ${AI_CLEANUP_SCHEDULE_ENABLED:-false}
      AI_CLEANUP_POLICY_VERSION: ${AI_CLEANUP_POLICY_VERSION:-stage7-v1}
      AI_CLEANUP_BATCH_SIZE: ${AI_CLEANUP_BATCH_SIZE:-500}
      AI_CLEANUP_MAX_RUNTIME_SECONDS: ${AI_CLEANUP_MAX_RUNTIME_SECONDS:-600}
      AI_DAILY_COST_SOFT_LIMIT: ${AI_DAILY_COST_SOFT_LIMIT:-}
      AI_DAILY_COST_HARD_LIMIT: ${AI_DAILY_COST_HARD_LIMIT:-}
    expose:
      - "9123"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://127.0.0.1:9123/actuator/health/readiness | grep UP"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 30s

  # ---------------- 3. 前端集装箱 ----------------
  frontend:
    image: ${NGINX_IMAGE:-dockerpull.com/library/nginx:alpine}
    container_name: learning_frontend
    restart: always
    ports:
      - "${FRONTEND_PORT:-8080}:80"
    depends_on:
      - backend
    volumes:
      - ./dist:/usr/share/nginx/html
      - ./nginx.conf:/etc/nginx/conf.d/default.conf

  prometheus:
    image: ${PROMETHEUS_IMAGE:-prom/prometheus:v2.54.1}
    container_name: learning_prometheus
    restart: always
    depends_on:
      backend:
        condition: service_healthy
    command: ["--config.file=/etc/prometheus/prometheus.yml", "--storage.tsdb.path=/prometheus"]
    volumes:
      - ./observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./observability/alerts.yml:/etc/prometheus/alerts.yml:ro
      - prometheus-data:/prometheus

  tempo:
    image: ${TEMPO_IMAGE:-grafana/tempo:2.6.1}
    container_name: learning_tempo
    restart: always
    command: ["-config.file=/etc/tempo.yml"]
    volumes:
      - ./observability/tempo.yml:/etc/tempo.yml:ro
      - tempo-data:/var/tempo

  grafana:
    image: ${GRAFANA_IMAGE:-grafana/grafana:11.2.2}
    container_name: learning_grafana
    restart: always
    depends_on:
      - prometheus
      - tempo
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?GRAFANA_ADMIN_PASSWORD is required}
      GF_USERS_ALLOW_SIGN_UP: "false"
    ports:
      - "127.0.0.1:${GRAFANA_PORT:-3000}:3000"
    volumes:
      - ./observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./observability/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana

volumes:
  qdrant-data:
  redis-data:
  prometheus-data:
  tempo-data:
  grafana-data:
