server {
    listen 80;
    listen [::]:80;
    server_name __DOMAIN__;
    server_tokens off;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    # Do not expose the application over plaintext HTTP during certificate
    # bootstrap. Business acceptance remains available through the SSH tunnel.
    location / {
        return 404;
    }
}
