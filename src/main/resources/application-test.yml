spring:
  flyway:
    # 测试默认关闭；需要空库启动验收时显式设置 FLYWAY_ENABLED=true，
    # 并提供具备 DDL 权限的隔离迁移账号。
    enabled: ${FLYWAY_ENABLED:false}
    user: ${FLYWAY_DB_USERNAME:__flyway_migrator_not_configured__}
    password: ${FLYWAY_DB_PASSWORD:__flyway_migrator_not_configured__}
  datasource:
    url: jdbc:mysql://${TEST_DB_HOST:localhost}:${TEST_DB_PORT:3306}/${TEST_DB_NAME:learning_manage_test}?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Shanghai&characterEncoding=utf8
    username: ${TEST_DB_USERNAME}
    password: ${TEST_DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver
  data:
    redis:
      host: ${TEST_REDIS_HOST:${REDIS_HOST:localhost}}
      port: ${TEST_REDIS_PORT:${REDIS_PORT:6379}}
      database: ${TEST_REDIS_DATABASE:1}
      username: ${TEST_REDIS_USERNAME:${REDIS_USERNAME:}}
      password: ${TEST_REDIS_PASSWORD:${REDIS_PASSWORD:}}
      timeout: 3000ms

ai:
  api-key: ${ALIYUN_API_KEY:test-only-not-a-real-key}
  knowledge-index:
    worker-enabled: ${AI_KNOWLEDGE_WORKER_ENABLED:false}
  embedding:
    base-url: ${AI_EMBEDDING_BASE_URL:http://127.0.0.1:18080/compatible-mode/v1}
    query-base-url: ${AI_EMBEDDING_QUERY_BASE_URL:http://127.0.0.1:18080/api/v1}
    api-key: ${AI_EMBEDDING_API_KEY:test-only-not-a-real-key}
  rag:
    enabled: false
    question-hmac-secret: test-only-rag-hmac-secret-with-at-least-32-bytes
  agent:
    enabled: false
    worker-enabled: false
    tool-calling-enabled: false
  rerank:
    base-url: ${AI_RERANK_BASE_URL:http://127.0.0.1:18081/compatible-api/v1}
    api-key: ${AI_RERANK_API_KEY:test-only-not-a-real-key}

qdrant:
  base-url: ${QDRANT_BASE_URL:http://127.0.0.1:16333}

security:
  jwt:
    secret: ${JWT_SECRET:test-only-jwt-secret-with-at-least-32-bytes}
    expire-seconds: ${JWT_EXPIRE_SECONDS:3600}

logging:
  level:
    root: warn

rate-limit:
  ai:
    enabled: true
    fail-open: true
    default-rule:
      window-seconds: 60
      max-requests: 5
    scene-rules:
      task-breakdown:
        window-seconds: 60
        max-requests: 3
      weekly-polish:
        window-seconds: 60
        max-requests: 5
      today-order:
        window-seconds: 60
        max-requests: 10
      daily-review-rename:
        window-seconds: 60
        max-requests: 5
      list-replan:
        window-seconds: 60
        max-requests: 3
      rag-project-ask:
        window-seconds: 60
        max-requests: 10
      project-risk-report:
        window-seconds: 600
        max-requests: 5
      team-workload-report:
        window-seconds: 600
        max-requests: 5
