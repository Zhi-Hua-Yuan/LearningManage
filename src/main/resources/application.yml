server:
  port: 8123
  servlet:
    context-path: /api

spring:
  application:
    name: LearningManage
  flyway:
    # PR 4 提供显式切换；默认关闭，避免应用启动自动改写现有数据库。
    enabled: ${FLYWAY_ENABLED:false}
    locations: classpath:db/migration
    # 迁移必须使用独立账号。占位值使误开启在未配置迁移账号时快速失败，
    # 不会回退到仅有业务 DML 权限的应用账号。
    user: ${FLYWAY_DB_USERNAME:__flyway_migrator_not_configured__}
    password: ${FLYWAY_DB_PASSWORD:__flyway_migrator_not_configured__}
    baseline-on-migrate: false
    validate-on-migrate: true
    clean-disabled: true
    out-of-order: false

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    db-config:
      logic-delete-field: isDelete
      logic-delete-value: 1
      logic-not-delete-value: 0

# AI 大模型配置 (阿里云通义千问)
ai:
  # 使用 ${} 读取系统环境变量，冒号后面是默认值（如果没有配置环境变量就用默认值）
  api-key: ${ALIYUN_API_KEY:}
  # 阿里云百炼平台的 OpenAI 兼容接口地址
  base-url: https://dashscope.aliyuncs.com/compatible-mode/v1
  model: qwen-plus
  breakdown-model: ${AI_BREAKDOWN_MODEL:}
  polish-model: ${AI_POLISH_MODEL:}
  fallback-model: ${AI_FALLBACK_MODEL:}
  connect-timeout-ms: ${AI_CONNECT_TIMEOUT_MS:5000}
  read-timeout-ms: ${AI_READ_TIMEOUT_MS:60000}
  chat:
    enabled: ${AI_CHAT_ENABLED:true}
  logging:
    max-body-chars: ${AI_LOG_MAX_BODY_CHARS:8000}
    max-error-chars: ${AI_LOG_MAX_ERROR_CHARS:2000}
  resilience:
    max-concurrent-calls: ${AI_MAX_CONCURRENT_CALLS:20}
    max-wait-millis: ${AI_MAX_WAIT_MILLIS:0}
    total-timeout-ms: ${AI_TOTAL_TIMEOUT_MS:120000}
    sliding-window-size: ${AI_CB_SLIDING_WINDOW_SIZE:20}
    minimum-number-of-calls: ${AI_CB_MINIMUM_CALLS:10}
    failure-rate-threshold: ${AI_CB_FAILURE_RATE_THRESHOLD:50}
    slow-call-duration-ms: ${AI_CB_SLOW_CALL_DURATION_MS:30000}
    slow-call-rate-threshold: ${AI_CB_SLOW_CALL_RATE_THRESHOLD:50}
    open-state-wait-ms: ${AI_CB_OPEN_WAIT_MS:30000}
    half-open-permitted-calls: ${AI_CB_HALF_OPEN_CALLS:3}
  pricing:
    version: ${AI_PRICE_VERSION:}
    currency: ${AI_PRICE_CURRENCY:CNY}
    models:
      qwen-plus:
        input-per-million: ${QWEN_PLUS_INPUT_PRICE:}
        output-per-million: ${QWEN_PLUS_OUTPUT_PRICE:}
  knowledge-index:
    # Outbox rows are always captured after V4. This switch controls consumers only.
    worker-enabled: ${AI_KNOWLEDGE_WORKER_ENABLED:false}
    poll-interval-ms: ${AI_KNOWLEDGE_POLL_MS:2000}
    claim-batch-size: ${AI_KNOWLEDGE_CLAIM_BATCH_SIZE:20}
    worker-concurrency: ${AI_KNOWLEDGE_WORKER_CONCURRENCY:4}
    lease-seconds: ${AI_KNOWLEDGE_LEASE_SECONDS:60}
    max-attempts: ${AI_KNOWLEDGE_MAX_ATTEMPTS:5}
    embedding-max-concurrent-calls: ${AI_KNOWLEDGE_EMBEDDING_CONCURRENCY:4}
    vector-max-concurrent-calls: ${AI_KNOWLEDGE_VECTOR_CONCURRENCY:8}
    circuit-sliding-window-size: ${AI_KNOWLEDGE_CB_WINDOW_SIZE:20}
    circuit-minimum-calls: ${AI_KNOWLEDGE_CB_MINIMUM_CALLS:10}
    circuit-failure-rate-threshold: ${AI_KNOWLEDGE_CB_FAILURE_RATE:50}
    circuit-open-wait-ms: ${AI_KNOWLEDGE_CB_OPEN_WAIT_MS:30000}
  embedding:
    base-url: ${AI_EMBEDDING_BASE_URL:https://dashscope.aliyuncs.com/compatible-mode/v1}
    query-base-url: ${AI_EMBEDDING_QUERY_BASE_URL:https://dashscope.aliyuncs.com/api/v1}
    api-key: ${AI_EMBEDDING_API_KEY:${ALIYUN_API_KEY:}}
    model: ${AI_EMBEDDING_MODEL:text-embedding-v4}
    dimension: ${AI_EMBEDDING_DIMENSION:1024}
    max-batch-size: ${AI_EMBEDDING_BATCH_SIZE:10}
    connect-timeout-ms: ${AI_EMBEDDING_CONNECT_TIMEOUT_MS:5000}
    read-timeout-ms: ${AI_EMBEDDING_READ_TIMEOUT_MS:30000}
    query-instruction: ${AI_EMBEDDING_QUERY_INSTRUCTION:Given a project-management question, retrieve passages that directly answer it.}
  rag:
    enabled: ${AI_RAG_ENABLED:false}
    initial-top-k: ${AI_RAG_INITIAL_TOP_K:20}
    final-top-k: ${AI_RAG_FINAL_TOP_K:8}
    max-chunks-per-source-before-rerank: ${AI_RAG_MAX_CHUNKS_BEFORE_RERANK:3}
    max-chunks-per-source-after-rerank: ${AI_RAG_MAX_CHUNKS_AFTER_RERANK:2}
    vector-score-threshold: ${AI_RAG_VECTOR_SCORE_THRESHOLD:0.25}
    rerank-score-threshold: ${AI_RAG_RERANK_SCORE_THRESHOLD:0.20}
    max-question-chars: ${AI_RAG_MAX_QUESTION_CHARS:1000}
    max-context-chars: ${AI_RAG_MAX_CONTEXT_CHARS:12000}
    result-retention-days: ${AI_RAG_RESULT_RETENTION_DAYS:30}
    retrieval-config-version: ${AI_RAG_CONFIG_VERSION:rag-v1}
    require-completed-backfill: ${AI_RAG_REQUIRE_BACKFILL:true}
    rerank-fallback-enabled: ${AI_RAG_RERANK_FALLBACK:true}
    question-hmac-secret: ${AI_RAG_QUESTION_HMAC_SECRET:}
    status-refresh-ms: ${AI_RAG_STATUS_REFRESH_MS:600000}
    status-refresh-batch-size: ${AI_RAG_STATUS_REFRESH_BATCH_SIZE:100}
  agent:
    enabled: ${AI_AGENT_ENABLED:false}
    worker-enabled: ${AI_AGENT_WORKER_ENABLED:false}
    tool-calling-enabled: ${AI_AGENT_TOOL_CALLING_ENABLED:false}
    poll-delay-ms: ${AI_AGENT_POLL_DELAY_MS:1000}
    batch-size: ${AI_AGENT_BATCH_SIZE:5}
    max-concurrent-runs: ${AI_AGENT_MAX_CONCURRENT_RUNS:4}
    max-concurrent-runs-per-user: ${AI_AGENT_MAX_CONCURRENT_RUNS_PER_USER:2}
    lease-seconds: ${AI_AGENT_LEASE_SECONDS:90}
    heartbeat-seconds: ${AI_AGENT_HEARTBEAT_SECONDS:15}
    overall-timeout-seconds: ${AI_AGENT_OVERALL_TIMEOUT_SECONDS:60}
    tool-timeout-seconds: ${AI_AGENT_TOOL_TIMEOUT_SECONDS:10}
    max-tool-calls: ${AI_AGENT_MAX_TOOL_CALLS:4}
    max-attempts: ${AI_AGENT_MAX_ATTEMPTS:2}
    max-tool-output-chars: ${AI_AGENT_MAX_TOOL_OUTPUT_CHARS:20000}
    project-task-limit: ${AI_AGENT_PROJECT_TASK_LIMIT:50}
    history-limit: ${AI_AGENT_HISTORY_LIMIT:5}
    draft-ttl-minutes: ${AI_AGENT_DRAFT_TTL_MINUTES:30}
  rerank:
    base-url: ${AI_RERANK_BASE_URL:https://dashscope.aliyuncs.com/compatible-api/v1}
    api-key: ${AI_RERANK_API_KEY:${ALIYUN_API_KEY:}}
    model: ${AI_RERANK_MODEL:qwen3-rerank}
    instruction: ${AI_RERANK_INSTRUCTION:Given a project-management question, retrieve passages that directly support the answer.}
    connect-timeout-ms: ${AI_RERANK_CONNECT_TIMEOUT_MS:5000}
    read-timeout-ms: ${AI_RERANK_READ_TIMEOUT_MS:30000}
    max-concurrent-calls: ${AI_RERANK_MAX_CONCURRENT_CALLS:4}

qdrant:
  base-url: ${QDRANT_BASE_URL:}
  api-key: ${QDRANT_API_KEY:}
  collection: ${QDRANT_COLLECTION:learning_knowledge_v1_1024}
  alias: ${QDRANT_ALIAS:learning_knowledge_current}
  require-secure-transport: ${QDRANT_REQUIRE_SECURE_TRANSPORT:false}

security:
  jwt:
    secret: ${JWT_SECRET}
    expire-seconds: ${JWT_EXPIRE_SECONDS:86400}

logging:
  pattern:
    level: "%5p [traceId:%X{traceId:-}]"

