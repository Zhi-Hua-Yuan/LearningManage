server:
  port: 8123
  servlet:
    context-path: /api

spring:
  application:
    name: LearningManage
  flyway:
    # PR 2 仅打包迁移能力；PR 3 完成接管演练后才允许按环境开启。
    enabled: ${FLYWAY_ENABLED:false}
    locations: classpath:db/migration
    baseline-on-migrate: false
    validate-on-migrate: true
    clean-disabled: true
    out-of-order: false

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    db-config:
      logic-delete-field: isDelete
      logic-delete-value: 1
      logic-not-delete-value: 0

# AI 大模型配置 (阿里云通义千问)
ai:
  # 使用 ${} 读取系统环境变量，冒号后面是默认值（如果没有配置环境变量就用默认值）
  api-key: ${ALIYUN_API_KEY}
  # 阿里云百炼平台的 OpenAI 兼容接口地址
  base-url: https://dashscope.aliyuncs.com/compatible-mode/v1
  model: qwen-plus
  breakdown-model: ${AI_BREAKDOWN_MODEL:}
  polish-model: ${AI_POLISH_MODEL:}
  fallback-model: ${AI_FALLBACK_MODEL:}
  connect-timeout-ms: ${AI_CONNECT_TIMEOUT_MS:5000}
  read-timeout-ms: ${AI_READ_TIMEOUT_MS:60000}

security:
  jwt:
    secret: ${JWT_SECRET}
    expire-seconds: ${JWT_EXPIRE_SECONDS:86400}

