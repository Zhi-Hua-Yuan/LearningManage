spring:
  flyway:
    # 开发环境也必须显式开启；开启时提供 FLYWAY_DB_USERNAME/PASSWORD。
    enabled: ${FLYWAY_ENABLED:false}
    user: ${FLYWAY_DB_USERNAME:__flyway_migrator_not_configured__}
    password: ${FLYWAY_DB_PASSWORD:__flyway_migrator_not_configured__}
  datasource:
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:learning_manage}?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Shanghai&characterEncoding=utf8
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      database: ${REDIS_DATABASE:0}
      password: ${REDIS_PASSWORD:}
      timeout: 3000ms

logging:
  level:
    root: info

# AI 大模型配置 (阿里云通义千问)
ai:
  # 使用 ${} 读取系统环境变量，冒号后面是默认值（如果没有配置环境变量就用默认值）
  api-key: ${ALIYUN_API_KEY:}
  # 阿里云百炼平台的 OpenAI 兼容接口地址
  base-url: https://dashscope.aliyuncs.com/compatible-mode/v1
  model: qwen-plus
  breakdown-model: ${AI_BREAKDOWN_MODEL:qwen-plus}
  polish-model: ${AI_POLISH_MODEL:qwen-flash}
  fallback-model: ${AI_FALLBACK_MODEL:qwen-plus}

rate-limit:
  ai:
    enabled: true
    fail-open: true
    default-rule:
      window-seconds: 60
      max-requests: 5
    scene-rules:
      task-breakdown:
        window-seconds: 60
        max-requests: 3
      weekly-polish:
        window-seconds: 60
        max-requests: 5
      today-order:
        window-seconds: 60
        max-requests: 10
      daily-review-rename:
        window-seconds: 60
        max-requests: 5
      list-replan:
        window-seconds: 60
        max-requests: 3
      rag-project-ask:
        window-seconds: 60
        max-requests: 10
      project-risk-report:
        window-seconds: 600
        max-requests: 5
      team-workload-report:
        window-seconds: 600
        max-requests: 5
