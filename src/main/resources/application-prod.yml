spring:
  flyway:
    # 生产默认关闭。生产变更先由受控迁移作业执行，再启动应用；如需受控
    # 启动迁移，必须同时显式设置 FLYWAY_ENABLED=true 和独立迁移账号。
    enabled: ${FLYWAY_ENABLED:false}
    user: ${FLYWAY_DB_USERNAME:__flyway_migrator_not_configured__}
    password: ${FLYWAY_DB_PASSWORD:__flyway_migrator_not_configured__}
  datasource:
    url: jdbc:mysql://${DB_HOST}:${DB_PORT}/${DB_NAME}?useSSL=false&serverTimezone=Asia/Shanghai&characterEncoding=utf8
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver
  data:
    redis:
      host: ${REDIS_HOST}
      port: ${REDIS_PORT}
      database: ${REDIS_DATABASE:0}
      password: ${REDIS_PASSWORD:}
      timeout: 3000ms

logging:
  level:
    root: info

ai:
  api-key: ${ALIYUN_API_KEY:}
  base-url: ${AI_BASE_URL:https://dashscope.aliyuncs.com/compatible-mode/v1}
  model: ${AI_MODEL:qwen-plus}
  breakdown-model: ${AI_BREAKDOWN_MODEL:qwen-plus}
  polish-model: ${AI_POLISH_MODEL:qwen-flash}
  fallback-model: ${AI_FALLBACK_MODEL:qwen-plus}

qdrant:
  require-secure-transport: ${QDRANT_REQUIRE_SECURE_TRANSPORT:true}

rate-limit:
  ai:
    enabled: ${AI_RATE_LIMIT_ENABLED:true}
    fail-open: ${AI_RATE_LIMIT_FAIL_OPEN:false}
    default-rule:
      window-seconds: ${AI_RATE_LIMIT_WINDOW_SECONDS:60}
      max-requests: ${AI_RATE_LIMIT_MAX_REQUESTS:5}
    scene-rules:
      task-breakdown:
        window-seconds: ${AI_RATE_LIMIT_TASK_BREAKDOWN_WINDOW_SECONDS:60}
        max-requests: ${AI_RATE_LIMIT_TASK_BREAKDOWN_MAX_REQUESTS:3}
      weekly-polish:
        window-seconds: ${AI_RATE_LIMIT_WEEKLY_POLISH_WINDOW_SECONDS:60}
        max-requests: ${AI_RATE_LIMIT_WEEKLY_POLISH_MAX_REQUESTS:5}
      today-order:
        window-seconds: ${AI_RATE_LIMIT_TODAY_ORDER_WINDOW_SECONDS:60}
        max-requests: ${AI_RATE_LIMIT_TODAY_ORDER_MAX_REQUESTS:10}
      daily-review-rename:
        window-seconds: ${AI_RATE_LIMIT_DAILY_REVIEW_RENAME_WINDOW_SECONDS:60}
        max-requests: ${AI_RATE_LIMIT_DAILY_REVIEW_RENAME_MAX_REQUESTS:5}
      list-replan:
        window-seconds: ${AI_RATE_LIMIT_LIST_REPLAN_WINDOW_SECONDS:60}
        max-requests: ${AI_RATE_LIMIT_LIST_REPLAN_MAX_REQUESTS:3}
      rag-project-ask:
        window-seconds: ${AI_RATE_LIMIT_RAG_WINDOW_SECONDS:60}
        max-requests: ${AI_RATE_LIMIT_RAG_MAX_REQUESTS:10}
