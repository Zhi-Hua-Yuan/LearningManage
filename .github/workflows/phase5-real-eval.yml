name: Phase 5 protected Spring AI evaluation

on:
  workflow_dispatch:
    inputs:
      backend_sha:
        description: Exact backend commit SHA to evaluate
        required: true
        type: string
      frontend_sha:
        description: Paired frontend commit SHA recorded in the evidence binding
        required: true
        type: string
      dataset_version:
        description: Frozen Stage 3 dataset version
        required: true
        default: '1.1.0'
        type: string

permissions:
  contents: read

concurrency:
  group: phase5-real-${{ inputs.backend_sha }}
  cancel-in-progress: false

env:
  JAVA_VERSION: '17'
  NODE_VERSION: '22.13.1'
  CI_MYSQL_IMAGE: mysql:8.0.41@sha256:bf577825b52ab281d6281fb281eabbfdc73507eda8f2c2745790251533ef0306
  DB_HOST: 127.0.0.1
  DB_PORT: '13316'
  SERVER_PORT: '18133'
  REDIS_HOST: 127.0.0.1
  REDIS_PORT: '6379'
  DB_NAME: learning_manage_ci_empty_stage5_real
  FLYWAY_EXPECTED_DB_NAME: learning_manage_ci_empty_stage5_real
  CI_EMPTY_DB_NAME: learning_manage_ci_empty_stage5_real
  CI_LEGACY_DB_NAME: learning_manage_ci_legacy_stage5_real
  CI_DB_GATE_AUTHORIZED: 'true'
  CI_MYSQL_ADMIN_USERNAME: root
  FLYWAY_DB_USERNAME: learning_manage_ci_migrator
  TEST_DB_USERNAME: learning_manage_ci_app
  STAGE3_API_BASE_URL: http://127.0.0.1:18133/api
  STAGE3_DB_HOST: 127.0.0.1
  STAGE3_DB_PORT: '13316'
  STAGE3_DB_NAME: learning_manage_ci_empty_stage5_real
  STAGE3_DB_USERNAME: learning_manage_stage5_reader
  STAGE3_SUT_MODEL: qwen-plus
  STAGE3_GRADER_MODEL: qwen-max
  STAGE3_GRADER_MAX_ATTEMPTS: '3'
  STAGE3_GRADER_TIMEOUT_MS: '60000'
  STAGE3_GRADER_MAX_COMPLETION_TOKENS: '1024'
  STAGE3_ENABLE_MODEL_GRADING: 'true'
  STAGE3_REQUIRE_USAGE: 'true'
  STAGE3_REQUIRE_PROVIDER_REQUEST_ID: 'true'
  STAGE3_ROUND_COUNT: '3'
  AI_CHAT_ADAPTER: spring-ai
  AI_RAG_ENABLED: 'false'
  AI_KNOWLEDGE_WORKER_ENABLED: 'false'
  AI_AGENT_ENABLED: 'false'
  AI_AGENT_WORKER_ENABLED: 'false'
  AI_AGENT_TOOL_CALLING_ENABLED: 'false'
  AI_CLEANUP_ENABLED: 'false'
  AI_CLEANUP_SCHEDULE_ENABLED: 'false'

jobs:
  real-core:
    name: Spring AI core qualification and regression/holdout rounds
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    environment: stage5-real-ai
    services:
      mysql:
        image: mysql:8.0.41@sha256:bf577825b52ab281d6281fb281eabbfdc73507eda8f2c2745790251533ef0306
        env:
          MYSQL_ROOT_PASSWORD: phase5_admin_${{ github.run_id }}_${{ github.run_attempt }}
        ports: [13316:3306]
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -pphase5_admin_${{ github.run_id }}_${{ github.run_attempt }} --silent"
          --health-interval=3s --health-timeout=3s --health-retries=30 --health-start-period=10s
      redis:
        image: redis:7.2.5
        ports: [6379:6379]
      qdrant:
        image: qdrant/qdrant:v1.18.2
        ports: [16333:6333]
    env:
      CI_MYSQL_ADMIN_PASSWORD: phase5_admin_${{ github.run_id }}_${{ github.run_attempt }}
      FLYWAY_DB_PASSWORD: phase5_migrator_${{ github.run_id }}_${{ github.run_attempt }}
      TEST_DB_PASSWORD: phase5_app_${{ github.run_id }}_${{ github.run_attempt }}
      STAGE3_DB_READER_USERNAME: learning_manage_stage5_reader
      STAGE3_DB_READER_PASSWORD: phase5_reader_${{ github.run_id }}_${{ github.run_attempt }}
      STAGE3_DB_PASSWORD: phase5_reader_${{ github.run_id }}_${{ github.run_attempt }}
      STAGE3_EVAL_PASSWORD: Stage5_${{ github.run_id }}_${{ github.run_attempt }}_Real_Aa9
      FLYWAY_BASELINE_ON_MIGRATE: 'false'
      STAGE5_BACKEND_SHA: ${{ inputs.backend_sha }}
      STAGE5_FRONTEND_SHA: ${{ inputs.frontend_sha }}
      STAGE3_BACKEND_SHA: ${{ inputs.backend_sha }}
      STAGE3_DATASET_VERSION: ${{ inputs.dataset_version }}
      ALIYUN_API_KEY: ${{ secrets.ALIYUN_API_KEY }}
      AI_BASE_URL: https://dashscope.aliyuncs.com/compatible-mode/v1
      STAGE3_DASHSCOPE_BASE_URL: https://dashscope.aliyuncs.com/compatible-mode/v1
      AI_MODEL: qwen-plus
      AI_BREAKDOWN_MODEL: qwen-plus
      AI_POLISH_MODEL: qwen-plus
      AI_FALLBACK_MODEL: qwen-plus
      AI_RATE_LIMIT_ENABLED: 'false'
      AI_PRICE_VERSION: ${{ vars.AI_PRICE_VERSION }}
      AI_PRICE_CURRENCY: ${{ vars.AI_PRICE_CURRENCY }}
      QWEN_PLUS_INPUT_PRICE: ${{ vars.QWEN_PLUS_INPUT_PRICE }}
      QWEN_PLUS_OUTPUT_PRICE: ${{ vars.QWEN_PLUS_OUTPUT_PRICE }}
      STAGE3_GRADER_PRICE_VERSION: ${{ vars.STAGE3_GRADER_PRICE_VERSION }}
      STAGE3_GRADER_INPUT_PRICE_CNY_PER_MILLION: ${{ vars.STAGE3_GRADER_INPUT_PRICE_CNY_PER_MILLION }}
      STAGE3_GRADER_OUTPUT_PRICE_CNY_PER_MILLION: ${{ vars.STAGE3_GRADER_OUTPUT_PRICE_CNY_PER_MILLION }}
      JWT_SECRET: phase5-real-evaluation-jwt-secret-with-at-least-32-bytes
      SPRING_PROFILES_ACTIVE: prod
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.backend_sha }}
          fetch-depth: 1
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: evals/stage3/package-lock.json
      - name: Verify immutable inputs and Phase 5 contract
        shell: bash
        run: |
          set -Eeuo pipefail
          [[ "$(git rev-parse HEAD)" == "${{ inputs.backend_sha }}" ]]
          [[ "${{ inputs.backend_sha }}" =~ ^[0-9a-f]{40}$ ]]
          [[ "${{ inputs.frontend_sha }}" =~ ^[0-9a-f]{40}$ ]]
          [[ "$(jq -r .datasetVersion evals/stage3/dataset-manifest.json)" == "$STAGE3_DATASET_VERSION" ]]
          [[ -n "${{ inputs.frontend_sha }}" ]]
          [[ "$AI_PRICE_CURRENCY" == "CNY" ]]
          [[ -n "$AI_PRICE_VERSION" && -n "$STAGE3_GRADER_PRICE_VERSION" ]]
          [[ "$QWEN_PLUS_INPUT_PRICE" =~ ^[0-9]+([.][0-9]+)?$ ]]
          [[ "$QWEN_PLUS_OUTPUT_PRICE" =~ ^[0-9]+([.][0-9]+)?$ ]]
          [[ "$STAGE3_GRADER_INPUT_PRICE_CNY_PER_MILLION" =~ ^[0-9]+([.][0-9]+)?$ ]]
          [[ "$STAGE3_GRADER_OUTPUT_PRICE_CNY_PER_MILLION" =~ ^[0-9]+([.][0-9]+)?$ ]]
          node evals/phase5/scripts/validate-matrix.mjs >/dev/null
      - uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95 # v5.6.0
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
          cache: maven
      - name: Install MySQL client and provision isolated database
        shell: bash
        run: |
          set -Eeuo pipefail
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install --yes default-mysql-client
          bash scripts/ci/wait-for-mysql.sh
          bash scripts/ci/provision-ci-databases.sh
          bash scripts/ci/verify-empty-database.sh
          bash scripts/ci/provision-stage3-eval-reader.sh
      - name: Start candidate backend and seed fixtures
        shell: bash
        run: |
          set -Eeuo pipefail
          ./mvnw -B -ntp -DskipTests package
          DB_USERNAME="$TEST_DB_USERNAME" DB_PASSWORD="$TEST_DB_PASSWORD" DB_NAME="$DB_NAME" \
            DB_HOST="$DB_HOST" DB_PORT="$DB_PORT" FLYWAY_ENABLED=false \
            java -jar target/LearningManage-0.0.1-SNAPSHOT.jar >"$RUNNER_TEMP/phase5-backend.log" 2>&1 &
          echo "$!" > "$RUNNER_TEMP/phase5-backend.pid"
          for attempt in $(seq 1 60); do
            if curl --silent --fail --max-time 3 "$STAGE3_API_BASE_URL/health" >/dev/null; then break; fi
            [[ "$attempt" != 60 ]] || { cat "$RUNNER_TEMP/phase5-backend.log"; exit 1; }
            sleep 2
          done
          bash scripts/ci/seed-stage3-eval.sh
      - name: Run one qualification and three regression/holdout rounds
        working-directory: evals/stage3
        env:
          STAGE3_PROMPT_MANIFEST: prompt-manifest.json
        shell: bash
        run: |
          set -Eeuo pipefail
          npm run install:ci
          npm run validate
          mkdir -p real-results
          run_round() {
            local split="$1" round="$2"
            local eval_status=1 report_status=1 gate_status=1
            rm -f output.json summary.json report.md
            set +e
            STAGE3_EVAL_SPLIT="$split" npm run eval:real
            eval_status=$?
            STAGE3_EVAL_SPLIT="$split" STAGE3_ROUND_COUNT=1 npm run report
            report_status=$?
            if [[ "$report_status" -eq 0 ]]; then
              STAGE3_EVAL_SPLIT="$split" STAGE3_REQUIRE_USAGE=true npm run gate
              gate_status=$?
            fi
            set -e
            if [[ -s output.json ]]; then
              mv output.json "real-results/${split}-round-${round}-raw.json"
            fi
            if [[ -s summary.json ]]; then
              mv summary.json "real-results/${split}-round-${round}-summary.json"
            fi
            if [[ -s report.md ]]; then
              mv report.md "real-results/${split}-round-${round}-report.md"
            fi
            if (( eval_status != 0 || report_status != 0 || gate_status != 0 )); then
              printf 'phase5.round.failure=split:%s,round:%s,eval:%s,report:%s,gate:%s\n' \
                "$split" "$round" "$eval_status" "$report_status" "$gate_status"
              return 1
            fi
          }
          run_round development 1
          for split in regression holdout; do
            for round in 1 2 3; do run_round "$split" "$round"; done
          done
          node scripts/create-human-review-sample.mjs real-results/regression-*-raw.json real-results/holdout-*-raw.json
      - name: Validate human review evidence when completed
        working-directory: evals/stage3
        shell: bash
        run: |
          set -Eeuo pipefail
          test -s human-review-sample.json
          jq -e '.sampleSize >= (.population * 0.2 | ceil)' human-review-sample.json >/dev/null
      - name: Aggregate rounds and bind immutable evidence
        working-directory: evals/stage3
        env:
          STAGE3_DEVELOPMENT_SUMMARY: real-results/development-round-1-summary.json
          STAGE3_PROMPT_MANIFEST: prompt-manifest.json
        shell: bash
        run: |
          set -Eeuo pipefail
          npm run real:aggregate -- real-results/candidate-summary.json \
            real-results/regression-*-summary.json real-results/holdout-*-summary.json
          jq -n \
            --arg backendSha "$STAGE3_BACKEND_SHA" \
            --arg frontendSha "${{ inputs.frontend_sha }}" \
            --arg datasetHash "$(jq -r .combinedSha256 dataset-manifest.json)" \
            --arg promptManifestHash "$(sha256sum prompt-manifest.json | cut -d' ' -f1)" \
            --arg candidateSummarySha "$(cut -d' ' -f1 real-results/candidate-summary.json.sha256)" \
            '{schemaVersion:1,status:"PASS",backendSha:$backendSha,frontendSha:$frontendSha,datasetHash:$datasetHash,promptManifestSha256:$promptManifestHash,candidateSummarySha256:$candidateSummarySha}' \
            > real-results/candidate-evidence-binding.json
      - name: Scan and upload protected evidence
        if: ${{ always() }}
        shell: bash
        run: |
          set -Eeuo pipefail
          targets=(evals/stage3/real-results evals/stage3/human-review-sample.json)
          if grep -R -q --fixed-strings "$ALIYUN_API_KEY" "${targets[@]}" 2>/dev/null; then exit 1; fi
          if grep -R -q --fixed-strings "$STAGE3_EVAL_PASSWORD" "${targets[@]}" 2>/dev/null; then exit 1; fi
          if grep -R -q -E '(^|[^A-Za-z0-9_])Bearer[[:space:]]+[A-Za-z0-9._-]{20,}|(^|[^A-Za-z0-9_])sk-[A-Za-z0-9_-]{16,}' "${targets[@]}" 2>/dev/null; then exit 1; fi
      - name: Upload Phase 5 core evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: phase5-real-core-${{ inputs.backend_sha }}-${{ github.run_id }}
          path: |
            evals/stage3/real-results
            evals/stage3/human-review-sample.json
            evals/stage3/dataset-manifest.json
            evals/stage3/prompt-manifest.json
            ${{ runner.temp }}/phase5-backend.log
          if-no-files-found: error
          retention-days: 30
      - name: Stop candidate backend
        if: ${{ always() }}
        shell: bash
        run: |
          if [[ -f "$RUNNER_TEMP/phase5-backend.pid" ]]; then kill "$(cat "$RUNNER_TEMP/phase5-backend.pid")" || true; fi
